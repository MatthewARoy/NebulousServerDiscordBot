version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nebulous-discord-bot
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=nebulous_project.settings
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount logs for easy access
      - ./logs:/app/logs
      # Mount database for persistence (optional, for local dev)
      - ./db.sqlite3:/app/db.sqlite3
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bot-network

  # Optional: Web interface for bot management (if needed in future)
  # web:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: nebulous-web
  #   command: gunicorn nebulous_project.wsgi:application --bind 0.0.0.0:8000
  #   env_file:
  #     - .env
  #   ports:
  #     - "8080:8000"
  #   depends_on:
  #     - bot
  #   networks:
  #     - bot-network

networks:
  bot-network:
    driver: bridge

volumes:
  bot-data:

