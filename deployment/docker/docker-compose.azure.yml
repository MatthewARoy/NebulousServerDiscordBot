# Docker Compose configuration for Azure Container Instances
version: '3.8'

services:
  bot:
    image: ${AZURE_CONTAINER_REGISTRY}.azurecr.io/nebulous-bot:${IMAGE_TAG:-latest}
    container_name: nebulous-discord-bot
    environment:
      - DJANGO_SETTINGS_MODULE=nebulous_project.settings
      - PYTHONUNBUFFERED=1
      # Azure will inject these from Key Vault or environment variables
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - APPLICATION_ID=${APPLICATION_ID}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - SERVER_CONFIGS=${SERVER_CONFIGS}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
    ports:
      - "8000:8000"
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

