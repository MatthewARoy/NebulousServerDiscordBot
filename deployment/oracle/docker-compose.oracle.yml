# Docker Compose configuration for Oracle Cloud Infrastructure.
# Copy this to your VM as docker-compose.yml.
#
# No explicit memory limit. The bot ran for 8 weeks unconstrained on the
# Always Free E2.1.Micro shape without issue. The wedges experienced on
# 2026-04-30 turned out to be `dnf-makecache` OOMs, not bot memory growth —
# see docs/OPS.md. Capping the container would have introduced a new
# failure mode (cgroup OOM-killing the container during legitimate bursts
# like !graph or !formation GIF rendering) without addressing the actual
# trigger.

services:
  bot:
    # Option 1: Use Docker Hub image (recommended)
    image: <your-dockerhub-username>/nebulous-bot:latest

    # Option 2: Build locally on VM
    # build:
    #   context: .
    #   dockerfile: deployment/docker/Dockerfile

    container_name: nebulous-discord-bot
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=nebulous_project.settings
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount persistent storage for database (if block storage is mounted)
      - /mnt/bot-data:/mnt/data
      # Mount logs directory
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
