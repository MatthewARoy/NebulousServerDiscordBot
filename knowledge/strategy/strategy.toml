summary = "Two Axford gunships pair heavy cannons with plotting, reload support, HE/AP ammunition, fire control, recovery, and defensive equipment."
lessons = ["Inspect the full combat package before changing an individual fitting.", "Repeated damage capability can coexist with complementary sensor equipment.", "Low control burden is a design objective."]
dependencies = ["Facing and range control", "Team support for roles outside the gun formation"]
