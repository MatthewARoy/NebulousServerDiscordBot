schema_version = 1
title = "Shipbuilding strategy for team PvP"
context = "Standard 3,000-point team PvP, ANS and OSP. A useful ship performs an explicit job at an appropriate cost, with known support and operating assumptions. Advice is conditional; a fleet is not required to cover every role by itself."
provenance = "Design synthesis from the curated Discord advice, local saved starter fleets inspected 2026-09-12, and the project owner's competitive guidance. These are teaching examples, not certified current built-in assets or measured optimal builds. No new community consensus or current-patch verification is claimed."

