title = "TF Hemlock: different jobs over time"
faction = "ans"
summary = "A missile-focused Axford carries a beam turret as a later fallback."
lessons = ["A secondary weapon may serve a later phase instead of diluting the first.", "Evaluate the fallback's cost against more ammunition or support."]
dependencies = ["Protected missile deployment", "A safe opportunity for the later beam role"]
source_file = "Starter Fleets - Alliance/TF Hemlock.fleet"
[[examples]]
id = "tantalum"
roles = ["capture", "scouting", "missile-support"]
title = "Tantalum Squadron: objectives and information"
faction = "osp"
summary = "Distributed scouting and capture assets operate with missile support and explicit reliance on teammates for craft protection."
lessons = ["Objective contribution and information can justify low direct damage.", "A team fleet can deliberately leave roles to teammates."]
dependencies = ["Independent asset control", "Allied craft cover where required"]
source_file = "Starter Fleets - Protectorate/Tantalum Squadron.fleet"

[[review_backlog]]
id = "quantitative-layout"
summary = "Map physical sockets and occupied volumes, verify safe-region claims, and test reinforced stacks against specified damage paths before generating placement warnings."
[[review_backlog]]
id = "current-performance"
summary = "Supply current game-calculated cost, power, crew, magazine capacity, hull modifiers, weapon cadence, arcs, and damage thresholds. The identity catalog alone cannot provide them."
[[review_backlog]]
id = "community-questions"
summary = "Resolve knowledge/QUESTIONS.md before automating disputed restore, ARR, DC-team, or universal component-avoidance thresholds. Preserve community provenance and patch sensitivity."
[[review_backlog]]
id = "creation"
summary = "Use game ship templates as reference candidates, preserve missile and craft dependencies, and apply reviewed changes through the game's fitting and serialization APIs. This module currently reads designs and produces guidance; it does not create legal game fits."
