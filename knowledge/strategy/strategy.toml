faction = "ans"
summary = "A well-supported cannon Axford operates with economical rail destroyers. Singing Mantle has no fitted search radar or PD turrets."
lessons = ["Frontline recovery requirements do not transfer automatically to backline ships.", "Lean support ships depend on position and shared information."]
