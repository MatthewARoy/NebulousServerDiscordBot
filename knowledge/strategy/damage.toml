limitations = [
  "This is a conditional packet-versus-destruction-threshold calculation, not a combat outcome, immunity verdict, HP simulation, or prediction of continued operation.",
  "The caller supplies one exact ordered hit collection and a current hull damage-reduction fraction. A saved socket list, neighboring socket names, or a selected group does not prove that the components share a ray, sphere overlap, or protected nose volume.",
  "Every selected component is assumed present and not destroyed. No destroyed entries, structure proxies, collider duplicates, missing recipients, ray geometry, incidence angles, armor penetration, misses, or overpenetration-mode selection are modeled.",
  "Thresholds are stock base values from the pinned build. Mods, runtime stat changes and unrecognized components need verified current values; they must not inherit guessed thresholds.",
  "Destruction requires resulting HP to be zero and the current individual packet to exceed DT strictly. Reinforced parts additionally require committed HP to have already been zero. Equality does not pass that gate; packet resistance does not stop HP loss or disabling.",
  "Hull damage reduction is a supplied assumption, never inferred from saved component count. The game derives it from occupied socket fraction and current hull stats; socket size and occupied volume do not replace that fraction.",
  "HEI and ray-cone entries evaluate one maximum ray. Larger HEI warheads increase the damage pool and potential attempts, not this stock 50 HP ray cap. Repeated rays, changing hit collections, damage-frame commits, repairs, fires, critical effects, crew losses and structural collapse are excluded.",
  "HE shell profiles assume a penetrating internal explosion without overpenetration and all selected recipients in that same explosion overlap. AP profiles assume a penetrating hit without overpenetration and damage only the first recipient; they do not divide the packet by stack size.",
  "Rail falloff and 500mm fracturing direct rays ignore hull DR in the serialized stock profiles. Secondary splash effects and different munitions sharing a calibre are excluded. No live firing trials were performed for this model.",
]

