# Hand-curated component classes: the named sets advice speaks in
# ("class:beam-weapons"). Membership is editorial judgment ("what counts
# as a beam weapon for this advice"), not a data dump, which is why this
# file is separate from the generated catalog. Names must be unique,
# lowercase-hyphenated; every member must resolve in components.toml
# (components or munitions), CI-validated. Seeded from what the current
# 47 entries talk about; phase 2 enrichment reviews membership entry by
# entry.

[[class]]
name = "beam-weapons"
members = ["Stock/Mk600 Beam Cannon", "Stock/Mk610 Beam Turret"]

# The plan sketch called this "chaff-launchers", but chaff is a munition
# fired from the standard missile launchers; the honest set is the decoy
# munitions themselves.
[[class]]
name = "chaff-decoys"
members = ["Stock/EA12 Chaff Decoy", "Stock/EA14 Chaff Decoy"]

[[class]]
name = "flare-decoys"
members = ["Stock/EA20 Flare Decoy"]

[[class]]
name = "antennas"
members = ["Stock/CR10 Antenna", "Stock/CR70 Antenna"]

