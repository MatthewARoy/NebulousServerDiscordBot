name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint with ruff
        run: ruff check . --output-format=github

      - name: Django system check
        env:
          # Provide stub values so Config.validate() can pass during `manage.py check`.
          DISCORD_TOKEN: stub-token-for-ci
          APPLICATION_ID: "0"
          STEAM_API_KEY: stub-key-for-ci
          SERVER_CONFIGS: '[{"guild_id": 1, "status_channel_id": 2}]'
        run: python manage.py check

      - name: Run formation_optimizer tests
        run: pytest formation_optimizer/tests -v
